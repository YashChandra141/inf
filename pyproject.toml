[project]
name = "infer"
version = "0.1.0"
description = "A from-scratch Llama-family LLM inference engine with KV cache, continuous batching, and an OpenAI-compatible API."
readme = "README.md"
authors = [
    { name = "yash chandra", email = "yashc14199@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.5",
    "safetensors>=0.4",
    "tokenizers>=0.20",
    "huggingface_hub>=0.26",
    "jinja2>=3.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "transformers>=4.45",
]
oracle = [
    "transformers>=4.45",
]

[project.scripts]
infer = "infer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "oracle: compares logits or greedy text against Hugging Face transformers",
]
